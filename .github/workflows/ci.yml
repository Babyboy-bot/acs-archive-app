name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.12'

jobs:
  # ============================================================================
  # FRONTEND - Lint, Build, Tests
  # ============================================================================
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./front

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit --skipLibCheck

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: front/.next
          retention-days: 7

  # ============================================================================
  # FRONTEND - Tests E2E Playwright
  # ============================================================================
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    
    defaults:
      run:
        working-directory: ./front

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: acs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend dependencies
        run: |
          cd ../backend
          python -m pip install --upgrade pip --no-cache-dir
          pip install --no-cache-dir -r requirements-ci.txt

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start backend server
        run: |
          cd ../backend
          python manage.py runserver &
          sleep 10
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/acs_test
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: 'True'

      - name: Start frontend server
        run: |
          npm run dev &
          sleep 15
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api

      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api
        continue-on-error: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: front/test-results
          retention-days: 7

  # ============================================================================
  # BACKEND - Lint, Tests
  # ============================================================================
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: acs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean
          docker system prune -af
          echo "Available space:"
          df -h

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --no-cache-dir
          pip install --no-cache-dir -r requirements-ci.txt

      - name: Run Django checks
        run: python manage.py check
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/acs_test
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: 'False'

      - name: Run migrations
        run: python manage.py migrate --run-syncdb
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/acs_test
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: 'False'

      - name: Run tests
        run: python manage.py test api --verbosity=2
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/acs_test
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: 'False'

  # ============================================================================
  # SECURITY - Dependency audit
  # ============================================================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high || echo "::warning::Des vulnérabilités npm ont été détectées"
        working-directory: ./front

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit backend dependencies
        run: pip-audit -r requirements.txt || echo "::warning::Des vulnérabilités pip ont été détectées"
        working-directory: ./backend

  # ============================================================================
  # SUMMARY
  # ============================================================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [frontend, backend, security]
    if: success()
    
    steps:
      - name: CI Pipeline completed
        run: echo "✅ All CI checks passed successfully!"
