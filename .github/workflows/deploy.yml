name: CD — Déploiement VPS

on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    branches: [main]
    types: [completed]

jobs:
  deploy:
    name: Déployer sur OVHcloud VPS
    runs-on: ubuntu-latest
    # Ne déploie que si le CI a réussi
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Déploiement via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.VPS_APP_PATH }}

            echo "==> Récupération des derniers changements..."
            git pull origin main

            echo "==> Rebuild et redémarrage des containers..."
            docker compose up -d --build --remove-orphans

            echo "==> Nettoyage des images inutilisées..."
            docker image prune -f

            echo "==> Vérification des containers..."
            docker compose ps

            echo "✅ Déploiement terminé."
