# ============================================================================
# Docker Compose - ACS Archive Application
# ============================================================================
# Usage:
#   Development: docker compose up -d
#   Production:  docker compose --profile production up -d
#   Logs:        docker compose logs -f
#   Stop:        docker compose down
# ============================================================================

services:
  # ==========================================================================
  # Base de données PostgreSQL
  # ==========================================================================
  db:
    image: postgres:16-alpine
    container_name: acs-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-acs_archive}
      POSTGRES_USER: ${POSTGRES_USER:-acs_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acs_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-acs_user} -d ${POSTGRES_DB:-acs_archive}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # Backend Django API
  # ==========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: acs-backend
    restart: unless-stopped
    user: root
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      # Variables de base de données (utilisées par settings.py)
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-acs_archive}
      - DB_USER=${POSTGRES_USER:-acs_user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-acs_password}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://frontend:3000}
      - ASSISTANT_LLM_ENABLED=${ASSISTANT_LLM_ENABLED:-false}
      - ASSISTANT_LLM_PROVIDER=${ASSISTANT_LLM_PROVIDER:-}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput --clear &&
             gunicorn --bind 0.0.0.0:8000 --workers 4 --threads 2 acs_backend.wsgi:application"

  # ==========================================================================
  # Frontend Next.js
  # ==========================================================================
  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: acs-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
    ports:
      - "3000:3000"

  # ==========================================================================
  # Nginx Reverse Proxy (optionnel, pour production)
  # ==========================================================================
  nginx:
    image: nginx:alpine
    container_name: acs-nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro
    profiles:
      - production

# ==========================================================================
# Volumes persistants
# ==========================================================================
volumes:
  postgres_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local

# ==========================================================================
# Réseaux
# ==========================================================================
networks:
  default:
    name: acs-network
    driver: bridge
