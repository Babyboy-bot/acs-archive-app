# =============================================================================
# Configuration Nginx - Reverse Proxy pour ACS Archive
# Sert le frontend et proxie /api vers le backend sur le même port
# Cela résout les problèmes de cookies cross-origin
# =============================================================================

events {
    worker_connections 1024;
}

http {
    # Masquer la version Nginx (sécurité : ne pas exposer les détails du serveur)
    server_tokens off;

    # Configuration du cache pour les PDF
    proxy_cache_path /var/cache/nginx/pdf_cache levels=1:2 keys_zone=pdf_cache:10m max_size=1g 
                    inactive=24h use_temp_path=off;
    
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Rate limiting — protection brute-force et DDoS
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=120r/m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript 
               application/xml application/xml+rss text/javascript application/x-javascript;
    
    # Optimisation des fichiers binaires (PDF)
    gzip_static on;
    gzip_proxied expired no-cache no-store private auth;

    # Upstream servers
    upstream frontend {
        server frontend:5000;
    }

    upstream backend {
        server backend:8000;
    }

    # Redirect HTTP → HTTPS
    server {
        listen 80;
        server_name assureursconseilservice.com www.assureursconseilservice.com;

        # Permettre la vérification Let's Encrypt (certbot)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name assureursconseilservice.com www.assureursconseilservice.com;

        # Certificats Let's Encrypt (générés par certbot)
        ssl_certificate /etc/letsencrypt/live/assureursconseilservice.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/assureursconseilservice.com/privkey.pem;

        # Configuration SSL sécurisée — TLS 1.2/1.3 uniquement, ciphers modernes ECDHE
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256';
        ssl_prefer_server_ciphers off;  # TLS 1.3 gère lui-même les ciphers
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;  # Désactivé pour assurer la Perfect Forward Secrecy

        # OCSP Stapling — réduit la latence de vérification des certificats
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;

        # Headers de sécurité globaux
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

        # Taille max des uploads (pour les documents)
        client_max_body_size 100M;

        # Servir le logo ACS comme favicon (proxy vers le frontend qui sert le fichier statique)
        location = /favicon.ico {
            proxy_pass http://frontend/acs-logo.svg;
            proxy_set_header Host $host;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        # Protection des endpoints d'authentification (login, refresh token)
        location ~* ^/api/(auth/login|auth/token|auth/refresh) {
            limit_req zone=auth_limit burst=5 nodelay;
            limit_req_status 429;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Les routes Next.js "app router" sous /api (ex: /api/assistant-demo, /api/proxy) doivent aller au frontend,
        # sinon nginx les enverra au backend Django et ça fera 404.
        location ^~ /api/assistant-demo {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeout étendu pour les appels LLM (Mistral peut prendre jusqu'à 90s)
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;

            # SSE : désactiver le buffering pour le streaming token par token
            proxy_buffering off;
            proxy_cache off;

            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Autoriser l'usage en iframe sur le même domaine
            proxy_hide_header X-Frame-Options;
            add_header X-Frame-Options "SAMEORIGIN" always;
        }

        # Route Next.js pour le proxy de documents (prévisualisation PDF)
        location ^~ /api/proxy {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Optimisation pour les PDF
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 8 256k;
            proxy_busy_buffers_size 256k;
            proxy_temp_file_write_size 256k;
            proxy_read_timeout 600s;

            # Activer le cache pour les PDF
            proxy_cache pdf_cache;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            proxy_cache_valid 200 302 1h;
            proxy_cache_valid 404 1m;
            
            # Permettre au client de mettre en cache
            add_header X-Cache-Status $upstream_cache_status;
            expires 1h;
            add_header Cache-Control "public, max-age=3600, must-revalidate";

            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Autoriser l'usage en iframe sur le même domaine
            proxy_hide_header X-Frame-Options;
            add_header X-Frame-Options "SAMEORIGIN" always;
        }

        # Proxy les requêtes /api/assistant/chat/ avec timeout étendu (LLM)
        location ^~ /api/assistant/chat/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            # Timeout étendu pour les appels LLM (2 tentatives × 30s + overhead)
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # Proxy les requêtes /api vers le backend Django
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            
            # WebSocket support (si nécessaire)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Proxy les requêtes /admin vers le backend Django 
        location /admin/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Fichiers statiques Django
        location /static/ {
            alias /var/www/static/;
            access_log off;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        # Fichiers media Django — protégés par authentification JWT
        location /media/ {
            # Vérifier l'authentification via le backend avant de servir le fichier
            auth_request /api/auth/verify/;
            error_page 401 403 = @media_non_autorise;

            alias /var/www/media/;
            access_log off;
            expires 1h;
            add_header Cache-Control "private, max-age=3600, must-revalidate";
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Content-Security-Policy "frame-ancestors 'self'" always;
        }

        location @media_non_autorise {
            default_type application/json;
            return 401 '{"erreur": "Authentification requise pour accéder à ce fichier"}';
        }

        # Endpoint de vérification d'auth (utilisé par auth_request nginx ET par le navigateur)
        location = /api/auth/verify/ {
            proxy_pass http://backend;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Tout le reste va vers le frontend Next.js
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support pour Next.js HMR
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Autoriser l'usage en iframe sur le même domaine
            proxy_hide_header X-Frame-Options;
            add_header X-Frame-Options "SAMEORIGIN" always;
        }

        # Health check
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
