# =============================================================================
# Configuration Nginx - Reverse Proxy pour ACS Archive
# Sert le frontend et proxie /api vers le backend sur le même port
# Cela résout les problèmes de cookies cross-origin
# =============================================================================

events {
    worker_connections 1024;
}

http {
    # Configuration du cache pour les PDF
    proxy_cache_path /var/cache/nginx/pdf_cache levels=1:2 keys_zone=pdf_cache:10m max_size=1g 
                    inactive=24h use_temp_path=off;
    
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript 
               application/xml application/xml+rss text/javascript application/x-javascript
               application/pdf application/octet-stream;
    
    # Optimisation des fichiers binaires (PDF)
    gzip_static on;
    gzip_proxied expired no-cache no-store private auth;

    # Upstream servers
    upstream frontend {
        server frontend:5000;
    }

    upstream backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # Taille max des uploads (pour les documents)
        client_max_body_size 100M;

        # Servir le logo ACS comme favicon (proxy vers le frontend qui sert le fichier statique)
        location = /favicon.ico {
            proxy_pass http://frontend/acs-logo.svg;
            proxy_set_header Host $host;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        # Les routes Next.js "app router" sous /api (ex: /api/assistant-demo, /api/proxy) doivent aller au frontend,
        # sinon nginx les enverra au backend Django et ça fera 404.
        location ^~ /api/assistant-demo {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Autoriser l'usage en iframe sur le même domaine
            proxy_hide_header X-Frame-Options;
            add_header X-Frame-Options "SAMEORIGIN" always;
        }

        # Route Next.js pour le proxy de documents (prévisualisation PDF)
        location ^~ /api/proxy {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Optimisation pour les PDF
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 8 256k;
            proxy_busy_buffers_size 256k;
            proxy_temp_file_write_size 256k;
            proxy_read_timeout 600s;

            # Activer le cache pour les PDF
            proxy_cache pdf_cache;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            proxy_cache_valid 200 302 1h;
            proxy_cache_valid 404 1m;
            
            # Permettre au client de mettre en cache
            add_header X-Cache-Status $upstream_cache_status;
            expires 1h;
            add_header Cache-Control "public, max-age=3600, must-revalidate";

            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Autoriser l'usage en iframe sur le même domaine
            proxy_hide_header X-Frame-Options;
            add_header X-Frame-Options "SAMEORIGIN" always;
        }

        # Proxy les requêtes /api vers le backend Django
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            
            # WebSocket support (si nécessaire)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Proxy les requêtes /admin vers le backend Django 
        location /admin/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Fichiers statiques Django
        location /static/ {
            alias /var/www/static/;
            access_log off;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        # Fichiers media Django
        location /media/ {
            alias /var/www/media/;
            access_log off;
            expires 1h;
            add_header Cache-Control "public, max-age=3600, must-revalidate";
            # Permettre l'affichage dans les iframes sur le même domaine (pour les miniatures PDF)
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Content-Security-Policy "frame-ancestors 'self'" always;
        }

        # Tout le reste va vers le frontend Next.js
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support pour Next.js HMR
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Autoriser l'usage en iframe sur le même domaine
            proxy_hide_header X-Frame-Options;
            add_header X-Frame-Options "SAMEORIGIN" always;
        }

        # Health check
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
