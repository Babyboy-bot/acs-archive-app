# pytest.ini
[tool:pytest]
# Django settings module for tests
DJANGO_SETTINGS_MODULE = acs_backend.settings

# Test discovery patterns
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Plugins
addopts =
    --strict-markers
    --strict-config
    --disable-warnings
    --tb=short
    --cov=.
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-fail-under=50

# Markers for different types of tests
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, with dependencies)
    slow: Slow tests (skip in CI unless explicitly requested)
    api: API endpoint tests
    models: Model tests
    views: View tests

# Ignore patterns
ignore_globs =
    *.pyc
    __pycache__
    .git
    .pytest_cache
    htmlcov
    .coverage
    migrations
