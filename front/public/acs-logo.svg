<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 260" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">ACS Logo</title>
  <desc id="logoDesc">Logo ACS - Assureurs Conseils Service avec icône de dossier orange.</desc>

  <defs>
    <linearGradient id="gMain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD34E"/>
      <stop offset="100%" stop-color="#FF8A00"/>
    </linearGradient>
    <linearGradient id="gBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFDF75"/>
      <stop offset="60%" stop-color="#FFAA30"/>
      <stop offset="100%" stop-color="#FF7500"/>
    </linearGradient>
    <linearGradient id="gText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFB627"/>
      <stop offset="100%" stop-color="#FF8000"/>
    </linearGradient>
    <filter id="dropshadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="rgba(0,0,0,0.18)"/>
    </filter>
  </defs>

  <!-- Dossier arrière (décalé, légèrement incliné) -->
  <g transform="rotate(6,155,120)" opacity="0.70" filter="url(#dropshadow)">
    <path d="M82,88 L82,178 Q82,188 92,188 L222,188 Q232,188 232,178 L232,98 Q232,88 222,88 L148,88 L130,70 Q125,63 117,63 L92,63 Q82,63 82,73 Z" fill="url(#gBack)"/>
  </g>

  <!-- Dossier principal — onglet -->
  <path d="M68,92 L68,76 Q68,65 78,65 L128,65 L150,84 Z" fill="url(#gMain)" filter="url(#dropshadow)"/>

  <!-- Dossier principal — corps -->
  <path d="M68,92 L237,92 Q248,92 248,103 L248,182 Q248,193 237,193 L79,193 Q68,193 68,182 Z" fill="url(#gMain)" filter="url(#dropshadow)"/>

  <!-- Petite flèche triangulaire (coin bas-droite) -->
  <path d="M220,205 L244,205 L244,181 Z" fill="#FF8A00" opacity="0.88"/>

  <!-- Texte ACS -->
  <text x="152" y="232" text-anchor="middle" font-family="'Arial Black', 'Impact', Arial, sans-serif" font-weight="900" font-size="42" fill="url(#gText)" letter-spacing="5">ACS</text>

  <!-- Texte ASSUREURS-CONSEILS-SERVICE -->
  <text x="152" y="250" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="10" fill="#FFA020" letter-spacing="4">ASSUREURS-CONSEILS- SERVICE</text>
</svg>
